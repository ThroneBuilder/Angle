services:
  - type: web
    name: angle
    runtime: static
    buildCommand: pnpm install && pnpm build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 24
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
